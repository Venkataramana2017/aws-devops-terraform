name: Terraform

on:
  push:
    branches-ignore:
      - main
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'modules/**'
      - 'bootstrap/**'
      - 'environments/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Last environment (always starts at dev, then test, pre, prod)
        type: choice
        options: [dev, test, pre, prod]
        required: true
      action:
        description: Operation to run in every selected environment
        type: choice
        options: [plan, apply, destroy]
        required: true
        default: plan
      confirmation:
        description: 'Confirm all stages: ACTION-through-ENVIRONMENT (example: apply-through-prod)'
        type: string
        required: false
      pr_number:
        description: 'Optional PR number for the result comment (same repository)'
        type: string
        required: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TERRAFORM_VERSION: '1.15.2'

jobs:
  request:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, '//'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      operation: ${{ steps.command.outputs.operation }}
      target: ${{ steps.command.outputs.target }}
      sha: ${{ steps.command.outputs.sha }}
      pr: ${{ steps.command.outputs.pr }}
    steps:
      - name: Resolve request and verify PR approval
        id: command
        uses: actions/github-script@v7
        env:
          INPUT_OPERATION: ${{ inputs.action || 'plan' }}
          INPUT_TARGET: ${{ inputs.environment || 'dev' }}
          INPUT_PR: ${{ inputs.pr_number || github.event.pull_request.number }}
        with:
          script: &authorize-command |
            if (context.eventName !== 'issue_comment') {
              core.setOutput('operation', process.env.INPUT_OPERATION);
              core.setOutput('target', process.env.INPUT_TARGET);
              core.setOutput('pr', process.env.INPUT_PR || '');
              core.setOutput('sha', context.sha);
              return;
            }
            const match = context.payload.comment.body.trim().match(/^(dev|test|pre|prod)\s+\/\/(plan|apply|destroy)$/i);
            if (!match) throw new Error('Specify one environment and command in the same comment, for example: dev //plan, test //apply, or prod //destroy.');
            const permission = async username => (await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username})).data.permission;
            const allowed = p => ['admin', 'maintain', 'write'].includes(p);
            if (!allowed(await permission(context.payload.comment.user.login))) throw new Error('Commands require repository write access.');
            const number = context.payload.issue.number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.state !== 'open' || pr.draft || pr.head.repo?.full_name !== context.payload.repository.full_name) throw new Error('Commands require an open, non-draft PR from this repository.');
            if (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA) throw new Error('PR changed; obtain approval and post a new command.');
            const reviews = await github.paginate(github.rest.pulls.listReviews, {...context.repo, pull_number: number, per_page: 100});
            const latest = new Map();
            for (const review of reviews) {
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) latest.set(review.user.login, review);
            }
            let approved = false;
            for (const [login, review] of latest) {
              if (login === pr.user.login || !allowed(await permission(login))) continue;
              if (review.state === 'CHANGES_REQUESTED') throw new Error('Outstanding changes requested on this PR.');
              if (review.state === 'APPROVED' && review.commit_id === pr.head.sha) approved = true;
            }
            if (!approved) throw new Error('The current PR commit needs approval from a reviewer with write access.');
            core.setOutput('operation', match[2].toLowerCase());
            core.setOutput('target', match[1].toLowerCase());
            core.setOutput('sha', pr.head.sha);
            core.setOutput('pr', number);

  checks:
    needs: request
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.inputs.outputs.environments }}
    steps:
      - name: Recheck command approval
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Check dispatch inputs
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ needs.request.outputs.target }}
          OPERATION: ${{ needs.request.outputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PR_NUMBER: ${{ needs.request.outputs.pr }}
          DEPLOY_BRANCH: feature_devops
        run: |
          if [[ "$EVENT" == "issue_comment" ]]; then
            targets=()
            for stage in dev test pre prod; do
              targets+=("$stage")
              [[ "$stage" == "$TARGET" ]] && break
            done
            echo "environments=$(printf '%s\n' "${targets[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/$DEPLOY_BRANCH" ]] || { echo "Run manual operations from the $DEPLOY_BRANCH branch."; exit 1; }
            [[ "$TARGET" =~ ^(dev|test|pre|prod)$ ]] || exit 1
            [[ "$OPERATION" =~ ^(plan|apply|destroy)$ ]] || exit 1
            if [[ "$OPERATION" != "plan" ]]; then
              [[ "$CONFIRMATION" == "$OPERATION-through-$TARGET" ]] || { echo 'Confirmation does not match the operation and environment.'; exit 1; }
            fi
            [[ -z "$PR_NUMBER" || "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            targets=()
            for stage in dev test pre prod; do
              targets+=("$stage")
              [[ "$stage" == "$TARGET" ]] && break
            done
            echo "environments=$(printf '%s\n' "${targets[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["dev"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Formatting
        run: |
          terraform fmt -check -recursive modules
          terraform fmt -check -recursive bootstrap
          terraform fmt -check -recursive environments
      - name: Check helper scripts
        run: |
          bash -n .github/scripts/prepare-terraform.sh
          node .github/scripts/pr-comment.test.js
          node .github/scripts/pr-command.test.js
          node .github/scripts/sequential-workflow.test.js
      - name: Validate all environments without AWS credentials
        run: |
          terraform -chdir=bootstrap/backend init -backend=false -input=false -lockfile=readonly
          terraform -chdir=bootstrap/backend validate -no-color
          for target in dev test pre prod; do
            terraform -chdir="environments/$target" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="environments/$target" validate -no-color
          done


  dev_plan:
    name: dev - plan
    needs: [request, checks]
    # Fork PRs receive static validation only. Never use pull_request_target here.
    if: ${{ !cancelled() && needs.request.result == 'success' && needs.checks.result == 'success' && contains(fromJSON(needs.checks.outputs.environments || '[]'), 'dev') && (github.event_name == 'issue_comment' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: dev-plan
    concurrency:
      group: terraform-state-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TARGET: dev
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON || '{}' }}
      STATE_BUCKET: bucket-backend-terraform-313932316713-us-east-1
      STATE_REGION: us-east-1
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Recheck command approval
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Prepare remote backend and variables
        run: bash ../../.github/scripts/prepare-terraform.sh
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.generated.hcl
      - name: Terraform plan
        id: plan
        env:
          OPERATION: ${{ needs.request.outputs.operation }}
        run: |
          args=()
          if [[ "$OPERATION" == 'destroy' ]]; then args+=(-destroy); fi
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -detailed-exitcode "${args[@]}" -out=deployment.tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [[ "$code" != 0 && "$code" != 2 ]]; then exit "$code"; fi
          terraform show -json deployment.tfplan | jq '{create: ([.resource_changes[]? | select(.change.actions | index("create"))] | length), update: ([.resource_changes[]? | select(.change.actions | index("update"))] | length), delete: ([.resource_changes[]? | select(.change.actions | index("delete"))] | length)}' > summary.json
          echo "### Terraform: $TARGET ($OPERATION)" >> "$GITHUB_STEP_SUMMARY"
          cat summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save exact plan for approval and execution
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment') && needs.request.outputs.operation != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev-${{ github.run_attempt }}
          path: |
            environments/dev/deployment.tfplan
            environments/dev/plan.txt
          retention-days: 1
          if-no-files-found: error
      - name: Comment plan result on PR
        if: always() && needs.request.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.request.outputs.pr }}
          RESULT: ${{ job.status }}
          OPERATION: ${{ needs.request.outputs.operation }}
          COMMIT_SHA: ${{ needs.request.outputs.sha }}
          PHASE: plan
        with:
          script: |
            const fs = require('fs');
            const comment = require('./.github/scripts/pr-comment.js');
            await comment({github, context, fs});

  dev_execute:
    name: dev - execute approved plan
    needs: [request, checks, dev_plan]
    if: ${{ !cancelled() && needs.dev_plan.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment') && needs.request.outputs.operation != 'plan' }}
    runs-on: ubuntu-latest
    # Configure required reviewers on these environments in GitHub Settings.
    environment: dev
    concurrency:
      group: terraform-state-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TARGET: dev
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON || '{}' }}
      STATE_BUCKET: bucket-backend-terraform-313932316713-us-east-1
      STATE_REGION: us-east-1
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Recheck command approval
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Prepare remote backend and variables
        run: bash ../../.github/scripts/prepare-terraform.sh
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.generated.hcl
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-dev-${{ github.run_attempt }}
          path: environments/dev
      - name: Verify PR is still approved before applying
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - name: Apply the approved plan (including destroy plans)
        run: terraform apply -input=false -no-color -lock-timeout=5m deployment.tfplan
      - name: Comment execution result on PR
        if: always() && needs.request.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.request.outputs.pr }}
          RESULT: ${{ job.status }}
          OPERATION: ${{ needs.request.outputs.operation }}
          COMMIT_SHA: ${{ needs.request.outputs.sha }}
          PHASE: execution
        with:
          script: |
            const fs = require('fs');
            const comment = require('./.github/scripts/pr-comment.js');
            await comment({github, context, fs});

  test_plan:
    name: test - plan
    needs: [request, checks, dev_plan, dev_execute]
    # Fork PRs receive static validation only. Never use pull_request_target here.
    if: ${{ !cancelled() && needs.request.result == 'success' && needs.checks.result == 'success' && contains(fromJSON(needs.checks.outputs.environments || '[]'), 'test') && (github.event_name == 'issue_comment' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && ((needs.request.outputs.operation == 'plan' && needs.dev_plan.result == 'success') || (needs.request.outputs.operation != 'plan' && needs.dev_execute.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: test-plan
    concurrency:
      group: terraform-state-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TARGET: test
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON || '{}' }}
      STATE_BUCKET: bucket-backend-terraform-313932316713-us-east-1
      STATE_REGION: us-east-1
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: environments/test
    steps:
      - name: Recheck command approval
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Prepare remote backend and variables
        run: bash ../../.github/scripts/prepare-terraform.sh
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.generated.hcl
      - name: Terraform plan
        id: plan
        env:
          OPERATION: ${{ needs.request.outputs.operation }}
        run: |
          args=()
          if [[ "$OPERATION" == 'destroy' ]]; then args+=(-destroy); fi
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -detailed-exitcode "${args[@]}" -out=deployment.tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [[ "$code" != 0 && "$code" != 2 ]]; then exit "$code"; fi
          terraform show -json deployment.tfplan | jq '{create: ([.resource_changes[]? | select(.change.actions | index("create"))] | length), update: ([.resource_changes[]? | select(.change.actions | index("update"))] | length), delete: ([.resource_changes[]? | select(.change.actions | index("delete"))] | length)}' > summary.json
          echo "### Terraform: $TARGET ($OPERATION)" >> "$GITHUB_STEP_SUMMARY"
          cat summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save exact plan for approval and execution
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment') && needs.request.outputs.operation != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-test-${{ github.run_attempt }}
          path: |
            environments/test/deployment.tfplan
            environments/test/plan.txt
          retention-days: 1
          if-no-files-found: error
      - name: Comment plan result on PR
        if: always() && needs.request.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.request.outputs.pr }}
          RESULT: ${{ job.status }}
          OPERATION: ${{ needs.request.outputs.operation }}
          COMMIT_SHA: ${{ needs.request.outputs.sha }}
          PHASE: plan
        with:
          script: |
            const fs = require('fs');
            const comment = require('./.github/scripts/pr-comment.js');
            await comment({github, context, fs});

  test_execute:
    name: test - execute approved plan
    needs: [request, checks, test_plan]
    if: ${{ !cancelled() && needs.test_plan.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment') && needs.request.outputs.operation != 'plan' }}
    runs-on: ubuntu-latest
    # Configure required reviewers on these environments in GitHub Settings.
    environment: test
    concurrency:
      group: terraform-state-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TARGET: test
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON || '{}' }}
      STATE_BUCKET: bucket-backend-terraform-313932316713-us-east-1
      STATE_REGION: us-east-1
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: environments/test
    steps:
      - name: Recheck command approval
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Prepare remote backend and variables
        run: bash ../../.github/scripts/prepare-terraform.sh
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.generated.hcl
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-test-${{ github.run_attempt }}
          path: environments/test
      - name: Verify PR is still approved before applying
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - name: Apply the approved plan (including destroy plans)
        run: terraform apply -input=false -no-color -lock-timeout=5m deployment.tfplan
      - name: Comment execution result on PR
        if: always() && needs.request.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.request.outputs.pr }}
          RESULT: ${{ job.status }}
          OPERATION: ${{ needs.request.outputs.operation }}
          COMMIT_SHA: ${{ needs.request.outputs.sha }}
          PHASE: execution
        with:
          script: |
            const fs = require('fs');
            const comment = require('./.github/scripts/pr-comment.js');
            await comment({github, context, fs});

  pre_plan:
    name: pre - plan
    needs: [request, checks, test_plan, test_execute]
    # Fork PRs receive static validation only. Never use pull_request_target here.
    if: ${{ !cancelled() && needs.request.result == 'success' && needs.checks.result == 'success' && contains(fromJSON(needs.checks.outputs.environments || '[]'), 'pre') && (github.event_name == 'issue_comment' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && ((needs.request.outputs.operation == 'plan' && needs.test_plan.result == 'success') || (needs.request.outputs.operation != 'plan' && needs.test_execute.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: pre-plan
    concurrency:
      group: terraform-state-pre
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TARGET: pre
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON || '{}' }}
      STATE_BUCKET: bucket-backend-terraform-313932316713-us-east-1
      STATE_REGION: us-east-1
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: environments/pre
    steps:
      - name: Recheck command approval
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ needs.request.outputs.sha }}
        with:
          script: *authorize-command
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Prepare remote backend and variables
        run: bash ../../.github/scripts/prepare-terraform.sh
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.generated.hcl
      - name: Terraform plan
        id: plan
        env:
          OPERATION: ${{ needs.request.outputs.operation }}
        run: |
          args=()
          if [[ "$OPERATION" == 'destroy' ]]; then args+=(-destroy); fi
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -detailed-exitcode "${args[@]}" -out=deployment.tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [[ "$code" != 0 && "$code" != 2 ]]; then exit "$code"; fi
          terraform show -json deployment.tfplan | jq '{create: ([.resource_changes[]? | select(.change.actions | index("create"))] | length), update: ([.resource_changes[]? | select(.change.actions | index("update"))] | length), delete: ([.resource_changes[]? | select(.change.actions | index("delete"))] | length)}' > summary.json
          echo "### Terraform: $TARGET ($OPERATION)" >> "$GITHUB_STEP_SUMMARY"
          cat summary.json >> "$GITHUB_STEP_SUMMARY"
